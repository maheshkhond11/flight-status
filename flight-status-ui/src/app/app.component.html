<main class="page-shell">
  <section class="hero">
    <p class="brand">SKYROUTE SUPPORT</p>
    <h1>Flight status tracker</h1>
    <p>Check a flight’s current operational status using our provider-status service.</p>
  </section>

  <section class="panel" aria-label="Flight status search">
    <app-flight-search [loading]="isLoading" (search)="lookup($event)" />
  </section>

  @if (errorMessage) {
    <p class="error" role="alert">{{ errorMessage }}</p>
  } @else if (result) {
    <app-flight-result-card [result]="result" />
  } @else if (!hasSearched) {
    <p class="empty-state">Enter a flight number and date to begin.</p>
  }
</main>
